name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No PERPLEXITY_API_KEY is configured, deliberately: nothing in CI may
      # issue a billable request. The provider is exercised through an injected
      # fetch. Live checks are `npm run verify`, which a human runs.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
