name: CI

on:
  push:
    branches: [main]
  # `pull_request`, never `pull_request_target`: a fork's job gets no secrets
  # and a read-only token, so a pull request cannot reach anything of the
  # maintainer's. `pull_request_target` would hand it both.
  pull_request:

# The job only needs to read the code it is checking. Stated here rather than
# relied on from the repository default, so the default cannot loosen it.
permissions:
  contents: read

# A pull request that is pushed to repeatedly should not queue up runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No PERPLEXITY_API_KEY is configured, deliberately: nothing in CI may
      # issue a billable request. The provider is exercised through an injected
      # fetch. Live checks are `npm run verify`, which a human runs.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
